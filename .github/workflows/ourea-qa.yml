name: Ourea QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: JavaScript tests, source validation and data validation
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install Python QA dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-qa.txt

      - name: Compile Python
        run: python -m compileall -q scripts

      - name: SIATA and GeoJSON loader tests
        working-directory: scripts
        run: python -m unittest -v test_siata_ingest.py test_siata_event_diagnostics.py test_geojson_io.py

      - name: Browser optimizer checkpoint
        run: node frontend/scripts/generateCheckpoint.mjs

      - name: Formal MILP optimizer
        run: python scripts/optimizer_milp.py

      - name: Project validation
        run: python scripts/validate_project.py

      - name: Manifest and checksums
        run: |
          python scripts/make_manifest.py
          git diff --exit-code -- MANIFEST.json SHA256SUMS.txt

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        working-directory: frontend
        run: npx playwright test
